<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel Rotativo — TradeStars</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; color:#fff; font-family: Segoe UI, Inter, Arial; }
    .slide { position:absolute; inset:0; opacity:0; pointer-events:none; transition: opacity .8s ease; }
    .slide.ativo { opacity:1; pointer-events:auto; }
    .slide iframe { width:100%; height:100%; border:0; display:block; background:#000; }
    /* Indicador discreto no canto inferior direito */
    .indicador { position:fixed; bottom:10px; right:14px; display:flex; gap:6px; z-index:99; opacity:.55; }
    .ind-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.35); transition: background .3s; }
    .ind-dot.ativo { background:#34d399; box-shadow:0 0 8px #34d399; }
    /* Barra de progresso fininha no topo */
    .progresso { position:fixed; top:0; left:0; height:2px; background:linear-gradient(90deg,#a855f7,#22d3ee,#34d399); z-index:99; width:0%; transition: width 1s linear; }
  </style>
</head>
<body>
  <div id="palco"></div>
  <div class="progresso" id="progresso"></div>
  <div class="indicador" id="indicador"></div>

  <script>
    // ==== Configuração dos slides ====
    // duracao em segundos. Power BI demora pra carregar autenticado, então damos 5min cada.
    // Live Tribo é rápido, 3min basta.
    const SLIDES = [
      { url: "https://live-tribo-tv-d8qkgwptaq.web.app/tv",          duracao: 180, nome: "Live Tribo" },
      { url: "https://app.powerbi.com/reportEmbed?reportId=06d762fa-a24b-4212-8e05-5d6983b05efd&autoAuth=true&ctid=832b0736-d169-4301-a7d7-a8cc17c4a68f&filterPaneEnabled=false&navContentPaneEnabled=false&aspectRatio=Fill", duracao: 300, nome: "PBI 1" },
      { url: "https://app.powerbi.com/reportEmbed?reportId=89209ffc-0b02-40b5-bfa8-bd2de5c4e6d0&autoAuth=true&ctid=832b0736-d169-4301-a7d7-a8cc17c4a68f&filterPaneEnabled=false&navContentPaneEnabled=false&aspectRatio=Fill", duracao: 300, nome: "PBI 2" },
      { url: "https://app.powerbi.com/reportEmbed?reportId=9004efe6-16a8-465c-afbd-dc0b8fe80f07&autoAuth=true&ctid=832b0736-d169-4301-a7d7-a8cc17c4a68f&filterPaneEnabled=false&navContentPaneEnabled=false&aspectRatio=Fill", duracao: 300, nome: "PBI 3" },
      { url: "https://app.powerbi.com/reportEmbed?reportId=81de64a3-4fe4-4a85-be64-336ece3523e1&autoAuth=true&ctid=832b0736-d169-4301-a7d7-a8cc17c4a68f&filterPaneEnabled=false&navContentPaneEnabled=false&aspectRatio=Fill", duracao: 300, nome: "PBI 4" }
    ];

    // Reload da página inteira a cada 4h — limpa qualquer leak residual e garante
    // que slides com sessão expirada peguem nova autenticação.
    const RELOAD_GERAL_MS = 4 * 60 * 60 * 1000;

    const palco = document.getElementById("palco");
    const indicador = document.getElementById("indicador");
    const progressoEl = document.getElementById("progresso");

    // 1) Pré-cria TODOS os iframes (mantém estado: Power BI não precisa re-logar a cada ciclo)
    const slides = SLIDES.map((s, i) => {
      const div = document.createElement("div");
      div.className = "slide";
      div.dataset.idx = i;
      const ifr = document.createElement("iframe");
      ifr.src = s.url;
      ifr.allow = "autoplay; encrypted-media; fullscreen";
      ifr.referrerPolicy = "no-referrer-when-downgrade";
      div.appendChild(ifr);
      palco.appendChild(div);
      const dot = document.createElement("div");
      dot.className = "ind-dot";
      indicador.appendChild(dot);
      return { ...s, el: div, ifr, dot };
    });

    let idx = -1;
    let progressoTimer;

    function ativar(novo) {
      // Esconde o anterior, mostra o novo (sem destruir o anterior — sem leak)
      slides.forEach((s, i) => {
        s.el.classList.toggle("ativo", i === novo);
        s.dot.classList.toggle("ativo", i === novo);
      });
      idx = novo;
      // Barra de progresso visual
      clearInterval(progressoTimer);
      const dur = slides[novo].duracao * 1000;
      const ini = Date.now();
      progressoEl.style.width = "0%";
      progressoEl.style.transition = "none";
      requestAnimationFrame(() => {
        progressoEl.style.transition = "width 1s linear";
        progressoTimer = setInterval(() => {
          const p = Math.min(100, ((Date.now() - ini) / dur) * 100);
          progressoEl.style.width = p + "%";
          if (p >= 100) clearInterval(progressoTimer);
        }, 1000);
      });
    }

    function proximo() {
      ativar((idx + 1) % slides.length);
      setTimeout(proximo, slides[idx].duracao * 1000);
    }

    // Começa
    ativar(0);
    setTimeout(proximo, slides[0].duracao * 1000);

    // Auto-reload da página inteira a cada 4h
    setTimeout(() => location.reload(), RELOAD_GERAL_MS);
  </script>
</body>
</html>
